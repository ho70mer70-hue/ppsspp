name: PSP Web Lab - APK v1.20.4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    name: Build NormalOptimized (commit fa50bb1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fa50bb1976065c4f8b1b47af227d367fe9771555
          fetch-depth: 0
          submodules: recursive
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Assemble APK
        run: ./gradlew assembleNormalOptimized --stacktrace
      - name: List generated APKs
        run: find android/build/outputs -type f -name '*.apk' -print
      - name: Package build
        run: |
          mkdir -p ppsspp
          find android/build/outputs/apk/normal/optimized -type f -name '*.apk' -exec cp {} ppsspp/ \;
          test -n "$(find ppsspp -type f -name '*.apk' -print -quit)"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pspweblab-normalOptimized-v1.20.4
          path: ppsspp/*.apk
          if-no-files-found: error
